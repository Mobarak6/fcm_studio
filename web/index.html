<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- Flutter replaces this with its own once it starts. -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Send Firebase Cloud Messaging pushes while you build your app.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="FCM Studio">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>FCM Studio</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* The app's surface colors (AppTheme, Material 3 from #1F8AFD), so the
       loading screen hands over to the app without a flash. */
    :root {
      color-scheme: light dark;
      --surface: #f9f9ff;
      --on-surface: #191c20;
      --primary: #3f5f90;
      --track: #e1e2e9;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --surface: #111318;
        --on-surface: #e1e2e9;
        --primary: #a8c8ff;
        --track: #33353a;
      }
    }
    html, body {
      height: 100%;
      margin: 0;
      background: var(--surface);
    }
    #loading {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--surface);
      color: var(--on-surface);
      font: 600 18px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      transition: opacity 200ms ease-out;
    }
    #loading.done {
      opacity: 0;
      pointer-events: none;
    }
    #loading .logo {
      width: 72px;
      height: 72px;
    }
    #loading .name {
      margin-top: 16px;
    }
    #loading .track {
      position: relative;
      width: 160px;
      height: 4px;
      margin-top: 24px;
      overflow: hidden;
      border-radius: 2px;
      background: var(--track);
    }
    /* Indeterminate: a segment that keeps sliding across. */
    #loading .bar {
      position: absolute;
      inset: 0 auto 0 0;
      width: 40%;
      border-radius: 2px;
      background: var(--primary);
      animation: slide 1.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    @keyframes slide {
      from { transform: translateX(-100%); }
      to { transform: translateX(250%); }
    }
    @media (prefers-reduced-motion: reduce) {
      #loading { transition: none; }
      #loading .bar { animation: none; width: 100%; opacity: 0.6; }
    }
  </style>
</head>
